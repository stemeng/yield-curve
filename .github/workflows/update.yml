name: Update yield curve

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-yield-curve
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install ecbdata pandas matplotlib

      - name: Generate chart
        env:
          MPLBACKEND: Agg
        run: python yieldcurve.py

      - name: Save updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yield_curve.png
          if ! git diff --cached --quiet; then
            git commit -m "Update yield curve"
            git push
          fi
